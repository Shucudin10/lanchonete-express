<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lanchonete Express — Calculadora de Pedidos</title>

<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Custom Styles -->
<link href="style.css" rel="stylesheet">
</head>
<body>

<div class="topbar">
  <div class="container-xl d-flex align-items-center justify-content-between py-3">
    <div class="brand">
      <span class="brand-mark">LE</span>
      <div>
        <div class="brand-name">Lanchonete Express</div>
        <div class="brand-sub">balcão digital de pedidos</div>
      </div>
    </div>
    <div class="ipsc-tag d-none d-md-block">IFSC GAROPABA · PROGWEB 2</div>
  </div>
</div>

<main class="container-xl py-4 py-md-5">

  <div class="row g-4 g-lg-5">

     <!-- ================= COLUNA ESQUERDA — MONTAGEM DO PEDIDO ================= -->
    <div class="col-lg-7">

      <div class="section-eyebrow">Passo 1</div>
      <h1 class="section-title">Monte o seu pedido</h1>
      <p class="section-lead">Escolha o lanche, personalize os adicionais e ajuste a quantidade. O resumo é atualizado na hora, sem recarregar a página.</p>

      <div class="card order-card mt-4 shadow">
       <div class="card-body">

        <!-- Lanche principal -->
        <div class="field-block">
          <label for="select-lanche" class="field-label"><i class="bi bi-egg-fried"></i> Lanche principal</label>
          <select class="form-select order-input" id="select-lanche">
            <option value="0" data-nome="Selecione um lanche">— Selecione um lanche —</option>
            <option value="18.00" data-nome="X-Burger Clássico">X-Burger Clássico — R$ 18,00</option>
            <option value="22.00" data-nome="X-Salada Especial">X-Salada Especial — R$ 22,00</option>
            <option value="24.00" data-nome="Combo Vegano Verde">Combo Vegano Verde — R$ 24,00</option>
            <option value="26.00" data-nome="X-Bacon Supremo">X-Bacon Supremo — R$ 26,00</option>
          </select>
        </div>

        <!-- Adicionais -->
        <div class="field-block">
          <label class="field-label"><i class="bi bi-plus-circle"></i> Adicionais opcionais</label>
          <div class="row g-2">
            <div class="col-sm-6">
              <div class="addon-toggle">
                <div class="form-check form-switch mb-0">
                  <input class="form-check-input check-adicional" type="checkbox" role="switch" id="add-queijo" value="4.00" data-nome="Queijo Extra">
                  <label class="form-check-label" for="add-queijo">Queijo Extra</label>
                </div>
                <span class="badge addon-badge">+R$ 4,00</span>
              </div>
            </div>
            <div class="col-sm-6">
              <div class="addon-toggle">
                <div class="form-check form-switch mb-0">
                  <input class="form-check-input check-adicional" type="checkbox" role="switch" id="add-bacon" value="5.00" data-nome="Bacon Crocante">
                  <label class="form-check-label" for="add-bacon">Bacon Crocante</label>
                </div>
                <span class="badge addon-badge">+R$ 5,00</span>
              </div>
            </div>
            <div class="col-sm-6">
              <div class="addon-toggle">
                <div class="form-check form-switch mb-0">
                  <input class="form-check-input check-adicional" type="checkbox" role="switch" id="add-batata" value="3.00" data-nome="Batata Frita P">
                  <label class="form-check-label" for="add-batata">Batata Frita P</label>
                </div>
                <span class="badge addon-badge">+R$ 3,00</span>
              </div>
            </div>
            <div class="col-sm-6">
              <div class="addon-toggle">
                <div class="form-check form-switch mb-0">
                  <input class="form-check-input check-adicional" type="checkbox" role="switch" id="add-refri" value="6.00" data-nome="Refrigerante Lata">
                  <label class="form-check-label" for="add-refri">Refrigerante Lata</label>
                </div>
                <span class="badge addon-badge">+R$ 6,00</span>
              </div>
            </div>
          </div>
        </div>

        <div class="row g-4">
            <!-- Quantidade -->
          <div class="col-sm-6">
            <div class="field-block mb-0">
              <label class="field-label"><i class="bi bi-stack"></i> Quantidade</label>
              <div class="input-group qty-group">
                <button class="btn qty-btn" type="button" id="btn-menos">−</button>
                <input type="number" id="input-qtd" class="form-control text-center order-input" value="1" min="1" max="20">
                <button class="btn qty-btn" type="button" id="btn-mais">+</button>
              </div>
            </div>
          </div>

          <!-- Entrega -->
          <div class="col-sm-6">
            <div class="field-block mb-0">
              <label for="select-entrega" class="field-label"><i class="bi bi-bicycle"></i> Tipo de entrega</label>
              <select class="form-select order-input" id="select-entrega">
                <option value="0" data-nome="Retirada no Local">Retirada no local (grátis)</option>
                <option value="7.00" data-nome="Tele-entrega" selected>Tele-entrega (+R$ 7,00)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Cupom -->
        <div class="field-block mb-0">
          <label for="input-cupom" class="field-label"><i class="bi bi-ticket-perforated"></i> Cupom de desconto</label>
          <div class="input-group">
            <input type="text" id="input-cupom" class="form-control order-input" placeholder="Ex: BEMVINDO10">
            <button class="btn btn-apply-cupom" type="button" id="btn-cupom">Aplicar cupom</button>
          </div>
          <div id="cupom-feedback" class="cupom-feedback d-none"></div>
        </div>

       </div>
      </div>

      <div id="save-feedback" class="save-feedback d-none mt-3"></div>

    </div>
